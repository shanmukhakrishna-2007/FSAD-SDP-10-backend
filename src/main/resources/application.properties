spring.application.name=Career Compass AI

# Server Configuration — Railway sets PORT automatically
server.port=${PORT:8080}

# MySQL Database Configuration — Use env vars for deployment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careercompass?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shanmukha@1508}

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Execute data.sql script on startup (Spring Boot 3 pattern)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT Secret (Base64 equivalent of a 256-bit key)
jwt.secret=${JWT_SECRET:Y2FyZWVyY29tcGFzc2FpLW1pZG5pZ2h0LWdsYXNzLXNlY3JldC1rZXktMjAyNg==}
jwt.expiration=86400000

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:AIzaSyCz8rUY1oGNRcA-hqQXTeUafziaupeGdVc}

# CORS — Frontend URL for deployed environment
